repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-lint
        name: ruff-lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ty-type-check
        name: ty-type-check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
