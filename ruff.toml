line-length = 88
target-version = "py314"
src = [
    "packages/core/src",
    "packages/app/src",
    "packages/chat/src",
    "apps/examples/basic-app/src",
    "apps/examples/personal-agent/src",
]

[lint]
select = ["E", "F", "W", "C90"]
ignore = ["E203", "E501"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"__init__.py" = ["F401"]
