services:
  litellm:
    image: litellm/litellm:latest
    container_name: litellm
    ports:
      - "8000:8000"
    environment:
      - LITELLM_MODEL=meta-llama/Llama-2-7b
      - LITELLM_DEVICE=auto
      - LITELLM_NUM_THREADS=4
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

