[project]
name = "clay-mono"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "clay-core",
    "clay-chat",
    "clay-app",
    "basic-app",
    "personal-agent",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.uv.sources]
clay-core = { workspace = true }
clay-chat = { workspace = true }
clay-app = { workspace = true }
basic-app = { workspace = true }
personal-agent = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/examples/*"]
