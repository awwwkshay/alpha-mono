[project]
name = "alpha-mono"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "alpha-core",
    "alpha-chat",
    "alpha-app",
    "basic-app",
    "personal-agent",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-chat = { workspace = true }
alpha-app = { workspace = true }
basic-app = { workspace = true }
personal-agent = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
