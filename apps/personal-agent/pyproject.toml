[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal AI assistant connected to Slack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alpha-app",
    "ddgs>=0.5.0",
]

[tool.uv.sources]
alpha-app = { workspace = true }

[project.scripts]
personal-agent = "personal_agent.main:run"
