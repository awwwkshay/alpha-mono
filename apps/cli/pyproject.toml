[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clay-cli"
version = "0.0.1"
description = "Command-line tools for Clay apps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clay-studio-server==0.0.1",
    "typer>=0.25.1",
]

[tool.uv.sources]
clay-studio-server = { workspace = true }

[project.scripts]
clay = "clay_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clay_cli"]
