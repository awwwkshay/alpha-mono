[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.0.1"
description = "Personal AI assistant connected to Slack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clay-app==0.0.1",
    "clay-chat==0.0.1",
    "ddgs>=0.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
clay-app = { workspace = true }
clay-chat = { workspace = true }

[project.scripts]
personal-agent = "personal_agent.main:run"
