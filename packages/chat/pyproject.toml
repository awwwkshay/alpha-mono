[project]
name = "alpha-chat"
version = "0.0.1"
description = "Chat platform integrations (Slack, Telegram, GitHub) for alpha-mono agents"
readme = "README.md"
authors = [{ name = "Akshay Priyadarshi", email = "akshayp1904@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "alpha-core==0.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "PyGithub>=2.5.0",
    "pydantic>=2.13.4",
    "opentelemetry-api>=1.24.0",
]
keywords = ["agents", "ai", "chat", "github", "slack", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.uv.sources]
alpha-core = { workspace = true }

[tool.uv.build-backend]
module-name = "alpha_chat"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
