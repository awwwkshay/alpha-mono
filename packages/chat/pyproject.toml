[project]
name = "alpha-chat"
version = "0.1.0"
description = "Chat platform integrations (Slack, Telegram, GitHub) for alpha-python agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alpha-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "PyGithub>=2.5.0",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
alpha-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
