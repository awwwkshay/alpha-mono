[project]
name = "clay-app"
version = "0.0.1"
description = "Domain implementations for the Clay ecosystem (agents, workflows, workspace, evals)."
readme = "README.md"
authors = [{ name = "Akshay Priyadarshi", email = "akshayp1904@outlook.com" }]
requires-python = ">=3.14"
dependencies = ["clay-core==0.0.1", "litellm>=1.86.0", "opentelemetry-api>=1.24.0", "opentelemetry-sdk>=1.24.0", "opentelemetry-exporter-otlp-proto-grpc>=1.24.0", "pydantic>=2.13.4", "python-dotenv>=1.2.2", "httpx>=0.27.0"]
keywords = ["agents", "ai", "llm", "workflows", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.uv.sources]
clay-core = { workspace = true }

[tool.uv.build-backend]
module-name = "clay_app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
