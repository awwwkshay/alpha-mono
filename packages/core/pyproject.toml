[project]
name = "clay-core"
version = "0.0.1"
description = "Core components and utilities for the Clay ecosystem."
readme = "README.md"
authors = [{ name = "Akshay Priyadarshi", email = "akshayp1904@outlook.com" }]
requires-python = ">=3.14"
dependencies = ["litellm>=1.86.0", "opentelemetry-api>=1.24.0", "pydantic>=2.13.4", "python-dotenv>=1.2.2"]
keywords = ["agents", "ai", "llm", "workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.uv.build-backend]
module-name = "clay_core"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
